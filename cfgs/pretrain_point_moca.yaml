

optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'train', npoints: 1024}},
  val : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'test', npoints: 1024}},
  test : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'test', npoints: 1024}}}

model:
  NAME: Point_MOCA_new
  group_size: 32
  num_group: 64
  
  transformer_config:
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.1
    num_heads: 6
    encoder_dims: 384
    mask_ratio: 0.75
    mask_type: rand
    decoder_depth: 4
    decoder_num_heads: 6
  
  # MOCA configuration
  inv_delta: 5.0
  num_words: 4096
  num_new_words: 8
  kappa: 5.0
  pred_mlp_ratio: 2
  

# Training parameters

npoints: 1024
total_bs : 128
step_per_update : 1
max_epoch : 300

img_weight: 1.0
loc_weight: 0.0


grad_clip_norm: 2.0


momentum_teacher: 0.996
momentum_teacher_end: 0.998
momentum_teacher_schedule: cosine


consider_metric: None

